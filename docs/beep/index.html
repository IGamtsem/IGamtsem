<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beep">
<title>Quiz Beep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23e5383b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e25;
    --text: #f2f3f5;
    --muted: #8a8f9c;
    --line: #2a2e38;
    --p1: #e5383b;
    --p2: #2f80ed;
    --p3: #27ae60;
    --p4: #f2a900;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 10px 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0 auto 0 0; letter-spacing: .02em; }
  .seg { display: flex; background: var(--panel); border-radius: 10px; padding: 3px; border: 1px solid var(--line); }
  .seg button, .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; padding: 6px 11px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #2d323d; color: var(--text); }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 7px 12px; border-radius: 10px; }

  main { flex: 1; display: grid; gap: 12px; padding: 4px 16px 16px; min-height: 0; }
  main.n1 { grid-template: 1fr / 1fr; place-items: center; }
  main.n2 { grid-template: 1fr 1fr / 1fr; }
  main.n3 { grid-template: repeat(3, 1fr) / 1fr; }
  main.n4 { grid-template: 1fr 1fr / 1fr 1fr; }
  @media (min-aspect-ratio: 1/1) {
    main.n2 { grid-template: 1fr / 1fr 1fr; }
    main.n3 { grid-template: 1fr / repeat(3, 1fr); }
  }

  .buzz {
    --c: var(--p1);
    position: relative;
    border: 0; cursor: pointer;
    color: #fff; font: inherit; font-weight: 800;
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 75%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%);
    box-shadow: 0 10px 0 color-mix(in srgb, var(--c) 55%, #000), 0 18px 40px rgba(0,0,0,.45);
    transition: transform .06s, box-shadow .06s, filter .2s, opacity .2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 0; min-width: 0;
  }
  main.n1 .buzz {
    width: min(78vw, 62vh, 460px); aspect-ratio: 1; border-radius: 50%;
    font-size: clamp(40px, 13vw, 96px); letter-spacing: .06em;
  }
  main:not(.n1) .buzz { border-radius: 22px; font-size: clamp(26px, 7vw, 56px); width: 100%; height: calc(100% - 10px); }
  .buzz small { font-size: 13px; font-weight: 500; opacity: .75; letter-spacing: .04em; }
  .buzz:active, .buzz.down { transform: translateY(8px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 55%, #000), 0 6px 16px rgba(0,0,0,.4); }
  .buzz.locked { filter: grayscale(.85) brightness(.45); cursor: not-allowed; }
  .buzz.winner { animation: pulse .5s ease-in-out 3; outline: 5px solid #fff; outline-offset: 4px; }
  .buzz .name {
    background: transparent; border: 0; color: inherit; font: inherit; text-align: center; width: 90%;
    outline: none; pointer-events: none;
  }
  @keyframes pulse { 50% { filter: brightness(1.35); transform: scale(1.03); } }

  footer {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    padding: 0 16px 14px; color: var(--muted); font-size: 13px; min-height: 44px; flex-wrap: wrap;
  }
  #reset {
    background: #fff; color: #111; border: 0; border-radius: 999px; padding: 10px 26px;
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  #reset[hidden] { display: none; }
  #status { min-width: 0; text-align: center; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; color: var(--text); }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px;
    width: min(420px, calc(100vw - 32px)); padding: 20px;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  dialog label { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
  dialog input[type=range] { width: 100%; }
  dialog .row { display: flex; gap: 8px; flex-wrap: wrap; }
  dialog .names input {
    width: 100%; margin-bottom: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  dialog .close { margin-top: 18px; width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Quiz Beep</h1>
  <div class="seg" role="group" aria-label="Количество игроков">
    <button data-n="1" aria-pressed="true">1</button>
    <button data-n="2" aria-pressed="false">2</button>
    <button data-n="3" aria-pressed="false">3</button>
    <button data-n="4" aria-pressed="false">4</button>
  </div>
  <button class="icon-btn" id="fs" title="Во весь экран" aria-label="Во весь экран">⛶</button>
  <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙</button>
</header>

<main id="board" class="n1"></main>

<footer>
  <span id="status"></span>
  <button id="reset" hidden>Сброс</button>
</footer>

<dialog id="settings">
  <h2>Настройки</h2>
  <label>Звук</label>
  <div class="seg" role="group" id="soundSeg">
    <button data-s="beep" aria-pressed="true">Бип</button>
    <button data-s="buzzer" aria-pressed="false">Зуммер</button>
    <button data-s="ding" aria-pressed="false">Звонок</button>
  </div>
  <label for="vol">Громкость</label>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8">
  <label class="check"><input type="checkbox" id="lockout" checked> Блокировать остальных после первого нажатия</label>
  <label>Имена игроков</label>
  <div class="names" id="names"></div>
  <button class="icon-btn close" id="closeSettings">Готово</button>
</dialog>

<script>
(() => {
  const COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
  const KEYS = [['1', 'a'], ['2', 'l'], ['3', 'z'], ['4', 'm']];
  const PITCH = [1, 1.26, 1.5, 1.78];

  const store = {
    get(k, d) { try { const v = localStorage.getItem('qb:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('qb:' + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    n: store.get('n', 1),
    sound: store.get('sound', 'beep'),
    vol: store.get('vol', 0.8),
    lockout: store.get('lockout', true),
    names: store.get('names', ['Игрок 1', 'Игрок 2', 'Игрок 3', 'Игрок 4']),
    winner: null,
    t0: 0
  };

  // ---------- Audio ----------
  let ctx = null;
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(type, freq, start, dur, peak, decay) {
    const a = audio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), start + 0.01);
    if (decay) {
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    } else {
      g.gain.setValueAtTime(Math.max(peak, 0.0002), start + dur - 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    }
    o.connect(g).connect(a.destination);
    o.start(start);
    o.stop(start + dur + 0.05);
  }
  function play(i = 0) {
    const a = audio();
    const t = a.currentTime + 0.005;
    const v = state.vol;
    const p = PITCH[i] || 1;
    if (v <= 0) return;
    if (state.sound === 'beep') {
      tone('square', 880 * p, t, 0.42, 0.35 * v);
    } else if (state.sound === 'buzzer') {
      tone('sawtooth', 130 * p, t, 0.7, 0.4 * v);
      tone('sawtooth', 137 * p, t, 0.7, 0.4 * v);
    } else {
      tone('sine', 1320 * p, t, 1.4, 0.6 * v, true);
      tone('sine', 2640 * p, t, 0.6, 0.18 * v, true);
      tone('sine', 1320 * p, t + 0.18, 1.2, 0.45 * v, true);
    }
  }

  // ---------- UI ----------
  const board = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  function render() {
    board.className = 'n' + state.n;
    board.innerHTML = '';
    for (let i = 0; i < state.n; i++) {
      const b = document.createElement('button');
      b.className = 'buzz';
      b.style.setProperty('--c', COLORS[i]);
      b.dataset.i = i;
      if (state.n === 1) {
        b.innerHTML = 'BEEP';
      } else {
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = state.names[i] || ('Игрок ' + (i + 1));
        const hint = document.createElement('small');
        hint.textContent = 'клавиша ' + KEYS[i][0];
        b.append(name, hint);
      }
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(i); });
      b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); press(i); } });
      board.append(b);
    }
    document.querySelectorAll('header .seg button').forEach(btn =>
      btn.setAttribute('aria-pressed', String(+btn.dataset.n === state.n)));
    reset(true);
  }

  function setStatus() {
    if (state.n === 1) {
      statusEl.innerHTML = 'Нажмите кнопку или <kbd>Пробел</kbd>';
    } else if (state.winner === null) {
      statusEl.innerHTML = 'Кто первый? Клавиши ' + KEYS.slice(0, state.n).map(k => '<kbd>' + k[0] + '</kbd>').join(' ');
    }
  }

  function flash(el) {
    el.classList.add('down');
    setTimeout(() => el.classList.remove('down'), 140);
  }

  function press(i) {
    const btns = board.children;
    if (i >= btns.length) return;
    if (state.n > 1 && state.lockout && state.winner !== null) return;

    play(i);
    if (navigator.vibrate) navigator.vibrate(state.n === 1 ? 120 : [80, 40, 80]);
    flash(btns[i]);

    if (state.n === 1) return;

    if (state.lockout) {
      state.winner = i;
      for (const b of btns) b.classList.toggle('locked', +b.dataset.i !== i);
      btns[i].classList.add('winner');
      const ms = Math.round(performance.now() - state.t0);
      statusEl.textContent = (state.names[i] || 'Игрок ' + (i + 1)) + ' первый · ' + (ms / 1000).toFixed(2) + ' с после сброса';
      resetBtn.hidden = false;
    }
  }

  function reset(silent) {
    state.winner = null;
    state.t0 = performance.now();
    for (const b of board.children) b.classList.remove('locked', 'winner');
    resetBtn.hidden = true;
    setStatus();
  }

  resetBtn.addEventListener('click', () => reset());

  document.querySelectorAll('header .seg button').forEach(btn =>
    btn.addEventListener('click', () => { btn.blur(); state.n = +btn.dataset.n; store.set('n', state.n); render(); }));

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.repeat || dlg.open) return;
    const k = e.key.toLowerCase();
    if (state.n === 1 && (k === ' ' || k === 'enter' || k === '1')) { e.preventDefault(); press(0); return; }
    if (state.n > 1) {
      const idx = KEYS.findIndex(pair => pair.includes(k));
      if (idx > -1 && idx < state.n) { e.preventDefault(); press(idx); return; }
      if (k === 'r' || k === ' ' || k === 'escape') { e.preventDefault(); reset(); }
    }
  });

  // Fullscreen
  const fsBtn = document.getElementById('fs');
  const root = document.documentElement;
  if (!(root.requestFullscreen || root.webkitRequestFullscreen)) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    }
  });

  // Keep screen awake while the page is visible
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('pointerdown', function once() { keepAwake(); document.removeEventListener('pointerdown', once); });

  // ---------- Settings ----------
  const dlg = document.getElementById('settings');
  const vol = document.getElementById('vol');
  const lockout = document.getElementById('lockout');
  const namesBox = document.getElementById('names');

  document.getElementById('settingsBtn').addEventListener('click', () => {
    vol.value = state.vol;
    lockout.checked = state.lockout;
    document.querySelectorAll('#soundSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === state.sound)));
    namesBox.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const inp = document.createElement('input');
      inp.value = state.names[i] || '';
      inp.placeholder = 'Игрок ' + (i + 1);
      inp.maxLength = 24;
      inp.style.borderLeft = '6px solid ' + COLORS[i];
      inp.addEventListener('input', () => { state.names[i] = inp.value.trim() || ('Игрок ' + (i + 1)); store.set('names', state.names); });
      namesBox.append(inp);
    }
    dlg.showModal();
  });
  document.getElementById('closeSettings').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', render);

  document.querySelectorAll('#soundSeg button').forEach(b => b.addEventListener('click', () => {
    state.sound = b.dataset.s; store.set('sound', state.sound);
    document.querySelectorAll('#soundSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    play(0);
  }));
  vol.addEventListener('input', () => { state.vol = +vol.value; store.set('vol', state.vol); });
  vol.addEventListener('change', () => play(0));
  lockout.addEventListener('change', () => { state.lockout = lockout.checked; store.set('lockout', state.lockout); });

  render();
})();
</script>
</body>
</html>
